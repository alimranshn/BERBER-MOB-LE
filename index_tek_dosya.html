<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>GLAM & CUT | Berber, Kuaför & Yapay Zeka Stil Randevu Sistemi</title>
  <style>
    /* Orijinal CSS dosyanızdaki stil kodları korunmuştur, çok uzun olmaması adına temel yapılar bırakılmıştır. Kendi stil dosyanızı olduğu gibi kullanabilirsiniz. */
    :root {
      --primary: #2563eb; --accent: #f59e0b; --bg-main: #0a0e1a; --bg-card: #131b2e; --text-main: #f8fafc;
      --radius-md: 16px; --radius-full: 9999px;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .ai-zone-section { padding: 40px 0; }
    .ai-primary-btn { background: var(--primary); color: #fff; padding: 15px 30px; border-radius: var(--radius-full); border: none; cursor: pointer; font-size: 1.1rem; width: 100%; margin-top: 20px;}
    .tryon-canvas-wrapper { position: relative; width: 100%; max-width: 440px; margin: 0 auto; border: 2px solid #a855f7; border-radius: var(--radius-md); overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; min-height: 400px; }
    .tryon-canvas { width: 100%; height: auto; display: block; object-fit: cover; }
    .ai-spinner { width: 50px; height: 50px; border: 4px solid rgba(168, 85, 247, 0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 1s infinite linear; margin: 20px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .upload-btn-label input { display: none; }
    .upload-btn-label { display: block; padding: 15px; background: #1e293b; text-align: center; border-radius: 8px; cursor: pointer; border: 1px dashed #a855f7; margin-bottom: 20px;}
    .tryon-styles-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
    .tryon-style-pill { padding: 10px 20px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 20px; cursor: pointer; }
    .tryon-style-pill.active { background: #a855f7; border-color: #d8b4fe; }
    #aiResultContainer { display: none; margin-top: 30px; padding: 20px; background: var(--bg-card); border-radius: var(--radius-md); }
  </style>
</head>
<body>

<div class="container">
  <div class="ai-zone-section">
    <h2>Yapay Zeka Saç & Sakal Danışmanı</h2>
    
    <!-- Fotoğraf Yükleme Alanı -->
    <label class="upload-btn-label">
      <span>📁 Fotoğrafını Yükle</span>
      <input type="file" id="aiPhotoInput" accept="image/*">
    </label>
    
    <img id="previewImg" style="display:none; max-width: 200px; margin: 0 auto; border-radius: 8px;"/>

    <button type="button" class="ai-primary-btn" id="runAiAnalysisBtn">
      ⚡ GERÇEK YAPAY ZEKA İLE ANALİZ ET
    </button>

    <!-- Sonuç Alanı -->
    <div id="aiResultContainer">
      <div class="tryon-header-row" style="text-align:center; margin-bottom: 20px;">
        <h3>Fotoğrafınızda Canlı Saç & Sakal Uygulandı</h3>
      </div>

      <div class="tryon-canvas-wrapper" id="tryonCanvasWrapper">
        <!-- AI'dan dönen resim buraya basılacak -->
        <img id="virtualTryOnImage" class="tryon-canvas" src="" alt="AI Sonucu Bekleniyor...">
      </div>

      <div class="tryon-styles-row">
        <button class="tryon-style-pill active" onclick="changeAiStyle('Modern Fade')">Modern Fade</button>
        <button class="tryon-style-pill" onclick="changeAiStyle('Klasik Kesim')">Klasik Kesim</button>
        <button class="tryon-style-pill" onclick="changeAiStyle('Sakal Tasarımı')">Sakal Tasarımı</button>
      </div>
    </div>
  </div>
</div>

<script>
  let uploadedImageBase64 = null;
  let currentStyle = 'Modern Fade';

  // 1. Kullanıcıdan Fotoğrafı Al
  document.getElementById('aiPhotoInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImageBase64 = event.target.result;
        document.getElementById('previewImg').src = uploadedImageBase64;
        document.getElementById('previewImg').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  // 2. Analiz Butonuna Basıldığında AI'ı Tetikle
  document.getElementById('runAiAnalysisBtn').addEventListener('click', async function() {
    if (!uploadedImageBase64) {
      alert("Lütfen önce bir fotoğraf yükleyin!");
      return;
    }

    const resultContainer = document.getElementById('aiResultContainer');
    const canvasWrapper = document.getElementById('tryonCanvasWrapper');
    
    resultContainer.style.display = 'block';
    // Yüklenme Animasyonu Göster
    canvasWrapper.innerHTML = `
      <div style="text-align:center; color:#fff; width:100%;">
        <div class="ai-spinner"></div>
        <p>Gerçek Yapay Zeka Modeli İşliyor...</p>
        <p style="font-size: 0.8rem; color: #94a3b8;">Bu işlem bulut sunucusunda 10-15 saniye sürebilir.</p>
      </div>
    `;

    // 3. API'ye İsteği Gönder ve Sonucu Bekle
    const aiResultUrl = await fetchFromRealAiApi(uploadedImageBase64, currentStyle);

    // 4. API'den Gelen Gerçek Resmi Ekrana Bas
    canvasWrapper.innerHTML = `<img src="${aiResultUrl}" class="tryon-canvas" alt="AI Sonucu" />`;
  });

  // Stil Değiştirildiğinde Yeniden API'ye İstek At
  async function changeAiStyle(styleName) {
    currentStyle = styleName;
    document.querySelectorAll('.tryon-style-pill').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === styleName);
    });
    // Yeni stil ile analizi tekrar başlat
    document.getElementById('runAiAnalysisBtn').click();
  }

  // --- GERÇEK YAPAY ZEKA API BAĞLANTI KODU ---
  async function fetchFromRealAiApi(imageBase64, stylePrompt) {
    /* 
      TODO: BURAYA GERÇEK API BAĞLANTINIZI YAZACAKSINIZ 
      Örnek bir REST API İsteği:
      
      const response = await fetch('https://api.replicate.com/v1/predictions', {
        method: 'POST',
        headers: {
          'Authorization': 'Token SİZİN_REPLICATE_API_ANAHTARINIZ',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          version: "sizin-sectiginiz-model-versiyonu", // Örn: FaceSwap veya Inpainting modeli
          input: {
            image: imageBase64,
            prompt: "A realistic photo of a man with " + stylePrompt + " hairstyle, sharp barbershop fade",
            prompt_strength: 0.8
          }
        })
      });
      const data = await response.json();
      return data.output[0]; // API'nin döndürdüğü işlenmiş fotoğraf URL'si
    */

    // Şimdilik API entegre edilmediği için orijinal fotoğrafı uyarı vererek geri döndürüyoruz.
    return new Promise((resolve) => {
      setTimeout(() => {
        alert("DİKKAT: Gerçek yapay zeka modelinin çalışması için kod içindeki 'fetchFromRealAiApi' fonksiyonuna API anahtarınızı (Örn: Replicate veya kendi backend sunucunuz) girmelisiniz. Şimdilik orijinal resim gösteriliyor.");
        resolve(imageBase64); 
      }, 2500); // API yüklenme süresini simüle eder
    });
  }
</script>
</body>
</html>
